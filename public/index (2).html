<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header>
    <div class="brand">
      <img class="logo-mesa" src="mesa-logo.png" alt="MESA logo">
      <img class="logo-vit" src="vit-logo.png" alt="Vishwakarma Institute of Technology logo">
    </div>
    <h1 id="club-name">Attendance</h1>
    <p class="lede">Two quick steps: your details with your college email, then your location.</p>
  </header>

  <div id="flow">
    <section class="step" id="step-details" data-state="idle">
      <div class="badge" aria-hidden="true"><span>1</span></div>
      <div class="body">
        <h2>Your details</h2>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" autocapitalize="words" maxlength="60" placeholder="Your full name">

        <label for="email">College email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="100" placeholder="yourname@vit.edu">
        <p class="note" id="email-note" role="status" aria-live="polite" hidden></p>

        <label for="domain">Domain (optional)</label>
        <select id="domain"><option value="">Choose your domain</option></select>

        <label for="role">Position</label>
        <select id="role"><option value="">Choose your position</option></select>
      </div>
    </section>

    <section class="step" id="step-location" data-state="idle">
      <div class="badge" aria-hidden="true"><span>2</span></div>
      <div class="body">
        <h2>Your location</h2>
        <p class="hint">You need to be at the venue. Allow location when your browser asks.</p>
        <button type="button" class="btn secondary" id="btn-loc">Check my location</button>
        <p class="note" id="loc-note" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
  </div>

  <button type="button" class="btn primary" id="btn-submit" disabled>Mark attendance</button>
  <p class="note" id="submit-note" role="status" aria-live="polite" hidden></p>

  <section class="done" id="done" hidden>
    <h2 id="done-title">Attendance marked</h2>
    <dl>
      <dt>Name</dt><dd id="done-name"></dd>
      <dt>Email</dt><dd id="done-email"></dd>
      <dt>Time</dt><dd id="done-time"></dd>
      <dt>Status</dt><dd id="done-status"></dd>
    </dl>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
